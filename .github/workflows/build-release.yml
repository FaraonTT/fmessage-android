name: Build release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK 37
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0"

          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && \
             [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate SVG icon drawables
        run: python3 tools/gen_icons.py

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -e

          PASS="$(grep '^storePassword=' keystore/keystore.properties | cut -d= -f2-)"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore/fmessage-release.jks
          elif [ -f keystore/fmessage-release.jks.b64 ]; then
            base64 -d keystore/fmessage-release.jks.b64 > keystore/fmessage-release.jks || true
          fi

          if ! keytool -list \
            -keystore keystore/fmessage-release.jks \
            -storetype PKCS12 \
            -storepass "$PASS" > /dev/null 2>&1; then

            echo "::warning::Keystore unavailable - generating a new one"
            rm -f keystore/fmessage-release.jks

            keytool -genkeypair \
              -keystore keystore/fmessage-release.jks \
              -storetype PKCS12 \
              -alias fmessage \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -dname "CN=fMessage, O=fWorld"
          fi

      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          DATA_REPO: FaraonTT/fmessage-data
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: |
          set -e
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/fMessage-1.0.${{ github.run_number }}.apk"

      - name: Verify signature
        run: |
          set -e

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs dist/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fMessage-release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: fMessage 1.0.${{ github.run_number }}
          files: dist/*.apk
          generate_release_notes: true
